<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Makkah Guide">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e4a37"/>
      <stop offset="1" stop-color="#062a1f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8901c"/>
      <stop offset="0.5" stop-color="#e8c75a"/>
      <stop offset="1" stop-color="#b8901c"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- arch motif -->
  <path d="M256 74c-62 0-112 50-112 112v206h224V186c0-62-50-112-112-112z"
        fill="none" stroke="rgba(232,199,90,.22)" stroke-width="10"/>

  <!-- kaaba body -->
  <rect x="166" y="196" width="180" height="186" rx="8" fill="#101a16"/>
  <rect x="166" y="196" width="180" height="186" rx="8" fill="none" stroke="rgba(232,199,90,.35)" stroke-width="3"/>

  <!-- kiswah band -->
  <rect x="166" y="250" width="180" height="30" fill="url(#gold)"/>
  <!-- band detail -->
  <g fill="#0e4a37" opacity=".55">
    <circle cx="196" cy="265" r="5"/><circle cx="226" cy="265" r="5"/>
    <circle cx="256" cy="265" r="5"/><circle cx="286" cy="265" r="5"/>
    <circle cx="316" cy="265" r="5"/>
  </g>

  <!-- door -->
  <rect x="290" y="296" width="36" height="62" rx="4" fill="url(#gold)"/>

  <!-- hajar al-aswad corner marker -->
  <path d="M166 204 L190 204 L166 228 Z" fill="url(#gold)" opacity=".9"/>

  <!-- base -->
  <rect x="140" y="382" width="232" height="16" rx="8" fill="rgba(232,199,90,.5)"/>

  <!-- crescent -->
  <path d="M256 100a44 44 0 1 0 0 88 36 36 0 1 1 0-88z" fill="url(#gold)"/>
</svg>
