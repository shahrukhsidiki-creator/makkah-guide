# Netlify configuration — Makkah Guide
# Static site: nothing to build, just publish the folder as-is.

[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------------------
# Caching
#
# The critical rule is sw.js. A service worker that gets cached by the browser
# will keep serving the OLD site to returning visitors even after you deploy,
# sometimes for months. It must always be revalidated.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# HTML changes whenever you edit content — always check for a fresh copy.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# CSS/JS have no content hash in their filenames, so they must revalidate too.
# The service worker caches them locally anyway, so this costs almost nothing.
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/i18n/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Icons effectively never change — cache them hard.
[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/icon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------------------
# Security headers
# No Content-Security-Policy is set deliberately: the Urdu Nastaliq webfont
# loads from Google Fonts on demand, and a strict policy would block it.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=()"
